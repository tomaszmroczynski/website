    <!-- 🌍 Dynamiczny język ustawiany przez i18n -->

      document.documentElement.lang = localStorage.getItem("i18nextLng") || "no";

    <!-- 🔹 Meta tagi dla Twitter (X) -->

    <meta name="twitter:image" content="https://limes-interior.no/img/artistic_collage_social_media.jpg" />

    <!-- 🔹 Meta tagi dla Pinterest -->
    <meta name="pinterest-rich-pin" content="true" />
    <meta property="pinterest:image" content="https://limes-interior.no/img/artistic_collage_social_media.jpg" />

    <!-- 🔹 Dynamic Keywords -->
    <meta name="keywords" content="Anna Rasinska interiørdesign, interiørarkitekt, boligstyling, eventdekorasjon, moderne interiør, hjemmedekor, luksuriøse interiører, design" />

    <!-- 🌎 Dynamic SEO Meta Tags (z i18n.js) -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const lang = localStorage.getItem("i18nextLng") || "no";
        document.documentElement.lang = lang;

        const descriptions = {
          en: "Limes Interior Anna Rasinska is a professional interior design studio specializing in creating unique and functional spaces. We offer home staging, event decoration, and stylish interior solutions.",
          no: "Limes Interiør Anna Rasinska er et profesjonelt interiørdesignstudio som spesialiserer seg på boligstyling, eventdekorasjon og unike interiørløsninger.",
          pl: "Limes Interior Anna Rasinska to profesjonalne studio projektowania wnętrz oferujące home staging, dekorację eventów i aranżację wnętrz."
        };
        document.querySelector('meta[name="description"]').setAttribute("content", descriptions[lang] || descriptions["no"]);

        const keywordsList = {
          en: "Anna Rasinska, interior architect, interior design, home staging, event decoration, party styling, event planning, luxury interiors, home decor",
          no: "Anna Rasinska, interiørarkitekt, interiørdesign, boligstyling, eventdekorasjon, festdekor, eventplanlegging, hjemmedekor, luksuriøse interiører",
          pl: "Anna Rasinska, architekt wnętrz, projektowanie wnętrz, aranżacja wnętrz, dekoracja wnętrz, home staging, dekoracja eventów, organizacja eventów"
        };
        document.querySelector('meta[name="keywords"]').setAttribute("content", keywordsList[lang] || keywordsList["no"]);

        const locales = { en: "en_US", no: "no_NO", pl: "pl_PL" };
        document.querySelector('meta[property="og:locale"]').setAttribute("content", locales[lang] || locales["no_NO"]);
      });
    </script>

    <!-- 📱 Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- 📜 Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Limes Interiør Anna Rasinska</title>
  </head>
  <body>
    <noscript>Du må aktivere JavaScript for å bruke denne appen.</noscript>
    <div id="root"></div>
  </body>
</html>
