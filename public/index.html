    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const lang = localStorage.getItem("i18nextLng") || "no";
        document.documentElement.lang = lang;

        const descriptions = {
          en: "Limes Interior Anna Rasinska is a professional interior design studio specializing in creating unique and functional spaces. We offer home staging, event decoration, and stylish interior solutions.",
          no: "Limes Interiør Anna Rasinska er et profesjonelt interiørdesignstudio som spesialiserer seg på boligstyling, eventdekorasjon og unike interiørløsninger.",
          pl: "Limes Interior Anna Rasinska to profesjonalne studio projektowania wnętrz oferujące home staging, dekorację eventów i aranżację wnętrz."
        };
        document.querySelector('meta[name="description"]').setAttribute("content", descriptions[lang] || descriptions["no"]);

        const keywordsList = {
          en: "interior architect Eidsberg, interior architect Oslo, Sarpsborg, Halden, Ski, Lillestrøm, interior design Akershus, Anna Rasinska",
          no: "interiørarkitekt Eidsberg, interiørarkitekt Askim, interiørarkitekt Akershus, interiørarkitekt Oslo, Sarpsborg, Halden, Ski, Lillestrøm, boligstyling, Anna Rasinska",
          pl: "architekt wnętrz Eidsberg, architekt wnętrz Oslo, Sarpsborg, Halden, Ski, Lillestrøm, Anna Rasinska"
        };
        document.querySelector('meta[name="keywords"]').setAttribute("content", keywordsList[lang] || keywordsList["no"]);

        const locales = { en: "en_US", no: "no_NO", pl: "pl_PL" };
        document.querySelector('meta[property="og:locale"]').setAttribute("content", locales[lang] || locales["no_NO"]);
      });
    </script>
